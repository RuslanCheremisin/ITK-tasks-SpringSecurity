spring.application.name=ITK-tasks-SpringSecurity

#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.url=jdbc:h2:mem:SpringData-2-projections
#spring.datasource.username=user
#spring.datasource.password=123

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:5432/jdbc-task
spring.datasource.name=jdbc-task
spring.datasource.username=postgres
spring.datasource.password=123

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

jwt.secret=secret_key_secret_key_secret_key_secret_key_
jwt.expiration.hour_in_ms=3600000
jwt.expiration.hour_multiplier=24

server.port=8443

server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=123456
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=jwtapp